name: Monday Priorities Update

on:
  # Boss has discontinued Monday priority updates
  # schedule:
  #   # Run every Monday early morning Pacific time
  #   # 12:00 UTC = 5 AM PDT / 4 AM PST — always done before 8 AM regardless of DST
  #   - cron: '0 12 * * 1'

  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  run-priorities:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run post:priorities command
        run: php bin/console post:priorities
        env:
          APP_ENV: prod
          SLACK_OAUTH_TOKEN: ${{ secrets.SLACK_OAUTH_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
